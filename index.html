<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine 3D-Drucke</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 800px; margin: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        
        /* Animation für die Fortschrittsleiste */
        .progress-bar-bg { background: #eee; width: 100%; height: 10px; border-radius: 5px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #3498db, #2ecc71); width: 0%; transition: width 1.5s ease-in-out; }
    </style>
</head>
<body>

<div class="card">
    <h1>Aktuelle 3D-Druckaufträge</h1>
    <table>
        <thead>
            <tr><th>Projekt</th><th>Status</th><th>Fortschritt</th></tr>
        </thead>
        <tbody id="druck-tabelle">
            </tbody>
    </table>
</div>

<script>
    // Beispiel-Daten (später durch fetch CSV ersetzen)
    const auftraege = [
        { name: "Halterung", status: "Druckt", progress: "65%" },
        { name: "Gehäuse", status: "Warteschlange", progress: "0%" }
    ];

    const tbody = document.getElementById('druck-tabelle');
    
    auftraege.forEach(item => {
        tbody.innerHTML += `
            <tr>
                <td>${item.name}</td>
                <td>${item.status}</td>
                <td>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" style="width: ${item.progress}"></div>
                    </div>
                </td>
            </tr>
        `;
    });
</script>
</body>
</html>
