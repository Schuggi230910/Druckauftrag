
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D-Druck Manager</title>
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN">
    <style>
        :root { --bg: #050505; --card: rgba(255,255,255,0.05); --accent: #00d4ff; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        
        .card { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
        .card.hidden { filter: blur(15px); pointer-events: none; opacity: 0.6; }
        
        .thumb { width: 100%; height: 200px; object-fit: cover; border-radius: 12px; background: #111; }
        .progress-bar { height: 6px; background: #333; margin: 15px 0; border-radius: 3px; overflow: hidden; }
        .fill { height: 100%; background: var(--accent); transition: width 0.5s; }
    </style>
</head>
<body>

<h1>Live Druckaufträge</h1>
<div class="grid" id="app">Lade Daten...</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwAxCI8VI2QGPjI3p-Up7Mc7uqpB_nbPLz2Z14fE_Lup3nxeh1HdWO_5bhi__qOz9q9NQ/exec';

    async function fetchData() {
        try {
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();
            render(data);
        } catch (e) { console.error("Fehler beim Laden:", e); }
    }

    function render(data) {
        const app = document.getElementById('app');
        app.innerHTML = data.map(d => {
            const isHidden = d.Hide === 'TRUE';
            const statusText = d.Status === 'Abgeschlossen' ? `Druck abgeschlossen in ${d.Endlich}` : `Status: ${d.Status}`;
            
            return `
                <div class="card ${isHidden ? 'hidden' : ''}">
                    <img src="${isHidden ? '' : d.ImgSrc}" class="thumb" alt="Druckbild">
                    <h3>${isHidden ? 'Verstecktes Projekt' : d.Titel}</h3>
                    <p>${statusText}</p>
                    <div class="progress-bar"><div class="fill" style="width: ${d.Fortschritt}%"></div></div>
                </div>
            `;
        }).join('');
    }

    setInterval(fetchData, 10000); // Alle 10 Sekunden
    fetchData();
</script>
</body>
</html>
