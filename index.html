<!DOCTYPE html>
<html lang="de">
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D-Druck Dashboard</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #38bdf8; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: var(--card); border-radius: 16px; padding: 20px; border: 1px solid #334155; transition: transform 0.3s; }
        .card:hover { transform: translateY(-5px); }
        
        /* Fortschritts-Animation */
        .progress-bar { height: 8px; background: #334155; border-radius: 4px; margin: 15px 0; overflow: hidden; }
        .fill { height: 100%; background: var(--accent); transition: width 0.5s; }
        .printing .fill { animation: pulse 2s infinite; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .status-tag { padding: 4px 8px; border-radius: 4px; font-size: 0.8em; }
        .error { color: #f43f5e; border: 1px solid #f43f5e; }
    </style>
</head>
<body>

<h1>Druck-Dashboard</h1>
<div class="grid" id="dashboard">
    <div class="card printing">
        <h3>Halterung V2</h3>
        <p>Zeit verbleibend: 02:45h</p>
        <div class="progress-bar"><div class="fill" style="width: 65%;"></div></div>
        <span class="status-tag">Druck läuft...</span>
    </div>
</div>

<script>
    // Hier würde später der Fetch vom Google Sheet kommen
</script>
</body>
</html>
